<header class="site-header">
  <div class="wrapper">
    <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <nav class="site-nav">
      {%- for item in site.nav %}
      <a href="{{ item.url | prepend: site.baseurl }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>
